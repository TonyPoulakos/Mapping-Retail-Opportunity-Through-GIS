<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<title>New Balance Columbus V5</title>


<!-- LEAFLET -->

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- MAPLIBRE -->

<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
/>

<script
  src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js">
</script>


<!-- MAPLIBRE + LEAFLET BRIDGE -->

<script
  src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js">
</script>


<style>


/* =====================================================
   PAGE
   ===================================================== */

html,
body {
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:#f4f5f7;
}


#map {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}


/* =====================================================
   TITLE PANEL
   ===================================================== */

#title {
  position:absolute;

  top:max(14px, env(safe-area-inset-top));
  left:14px;

  z-index:1100;

  width:min(
    390px,
    calc(100vw - 28px)
  );

  box-sizing:border-box;

  background:rgba(255,255,255,.97);

  border:1px solid rgba(15,23,42,.08);

  border-radius:12px;

  padding:12px 42px 12px 14px;

  box-shadow:
    0 4px 18px
    rgba(15,23,42,.16);
}


#title .eyebrow {
  font-size:10px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:.08em;
  color:#64748b;
  text-transform:uppercase;
  margin-bottom:4px;
}


#title h1 {
  margin:0 0 5px;
  font-size:18px;
  line-height:1.15;
  color:#172b4d;
}


#title .subtitle {
  margin:0;
  font-size:11.5px;
  line-height:1.35;
  color:#586474;
}


/* =====================================================
   TITLE COLLAPSE BUTTON
   ===================================================== */

#titleToggle {
  position:absolute;
  top:8px;
  right:8px;

  width:28px;
  height:28px;

  padding:0;
  border:0;
  border-radius:6px;

  background:rgba(241,245,249,.90);
  color:#475569;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
  touch-action:manipulation;
}


#titleToggle:hover {
  background:#e8edf2;
}


#titleToggle svg {
  width:16px;
  height:16px;

  transition:transform .18s ease;
}


#title.collapsed {
  padding-top:10px;
  padding-bottom:10px;
}


#title.collapsed .eyebrow,
#title.collapsed .subtitle {
  display:none;
}


#title.collapsed h1 {
  margin:0;
}


#title.collapsed #titleToggle svg {
  transform:rotate(180deg);
}


/* =====================================================
   RIGHT-SIDE MAP CONTROLS
   ===================================================== */

#rightControls {
  position:absolute;

  top:max(
    14px,
    env(safe-area-inset-top)
  );

  right:14px;

  z-index:1200;

  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:8px;
}


.map-control-button {
  width:42px;
  height:42px;

  padding:0;
  box-sizing:border-box;

  border:1px solid rgba(0,0,0,.18);
  border-radius:8px;

  background:#ffffff;

  box-shadow:
    0 1px 5px
    rgba(0,0,0,.22);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


.map-control-button:hover {
  background:#f4f6f8;
}


.map-control-button svg {
  width:22px;
  height:22px;
  display:block;
}


/* =====================================================
   CUSTOM LAYER PANEL
   ===================================================== */

#layerPanel {
  position:absolute;

  right:14px;

  z-index:1190;

  display:none;

  width:min(
    286px,
    calc(100vw - 28px)
  );

  box-sizing:border-box;

  background:rgba(255,255,255,.98);

  border:1px solid rgba(15,23,42,.10);
  border-radius:10px;

  box-shadow:
    0 4px 16px
    rgba(15,23,42,.20);

  padding:10px 12px;

  font-size:11px;
  line-height:1.3;
}


#layerPanel.open {
  display:block;
}


.layer-panel-title {
  font-size:9px;
  font-weight:900;
  letter-spacing:.07em;
  color:#475569;
  text-transform:uppercase;
  margin-bottom:5px;
}


.layer-panel-section {
  margin-top:8px;
  padding-top:7px;
  border-top:1px solid #e5e7eb;
}


.layer-panel-section:first-child {
  margin-top:0;
  padding-top:0;
  border-top:0;
}


.layer-option {
  display:grid;

  grid-template-columns:
    20px 1fr;

  align-items:center;

  min-height:27px;

  gap:3px;

  color:#334155;

  cursor:pointer;

  user-select:none;
}


.layer-option input {
  margin:0;

  width:14px;
  height:14px;

  accent-color:#475569;
}


.layer-option span {
  display:block;
}


/* =====================================================
   CANDIDATE MARKERS
   ===================================================== */

.candidate-marker {
  width:40px;
  height:40px;

  border-radius:50%;

  border:3px solid rgba(255,255,255,.98);

  box-sizing:border-box;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.34);

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:17px;
  font-weight:900;

  opacity:.90;
}


.a {
  background:#d73027;
}


.b {
  background:#245bbf;
}


.c {
  background:#18864b;
}


/* =====================================================
   NEW BALANCE OWNED RETAIL
   ===================================================== */

.nb-marker {
  width:28px;
  height:28px;

  box-sizing:border-box;

  background:#ffffff;

  border:2px solid #111827;
  border-radius:3px;

  box-shadow:
    0 1px 5px
    rgba(0,0,0,.28);

  color:#111827;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:10px;
  font-weight:900;

  letter-spacing:-.3px;
}


/* =====================================================
   SPECIALTY RUNNING
   ===================================================== */

.crc-marker-wrap {
  position:relative;
  width:18px;
  height:16px;
}


.crc-triangle {
  position:absolute;

  left:1px;
  top:1px;

  width:0;
  height:0;

  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-bottom:14px solid #6b7280;

  filter:
    drop-shadow(
      0 1px 1px
      rgba(0,0,0,.28)
    );
}


/* =====================================================
   MAJOR ATHLETIC RETAIL
   ===================================================== */

.major-retail-marker {
  width:15px;
  height:15px;

  box-sizing:border-box;

  background:#7b3fc6;

  transform:rotate(45deg);

  border-radius:1px;

  box-shadow:
    0 1px 3px
    rgba(0,0,0,.30);
}


/* =====================================================
   ACTIVE-LIFESTYLE NODE
   ===================================================== */

.active-hexagon {
  width:17px;
  height:15px;

  background:#2b9fb3;

  clip-path:
    polygon(
      25% 0%,
      75% 0%,
      100% 50%,
      75% 100%,
      25% 100%,
      0% 50%
    );

  filter:
    drop-shadow(
      0 1px 1px
      rgba(0,0,0,.28)
    );
}


/* =====================================================
   LEGEND
   ===================================================== */

.legend {
  position:relative;

  background:rgba(255,255,255,.97);

  padding:9px 11px;

  border-radius:10px;

  border:1px solid rgba(15,23,42,.08);

  box-shadow:
    0 2px 11px
    rgba(15,23,42,.15);

  font-size:10.5px;
  line-height:1.35;

  max-width:250px;

  box-sizing:border-box;
}


.legend-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}


.legend-title {
  font-size:10px;
  font-weight:900;
  letter-spacing:.06em;
  color:#334155;
  text-transform:uppercase;
  margin:0;
}


.legend-toggle {
  width:24px;
  height:24px;

  padding:0;

  border:0;
  border-radius:5px;

  background:rgba(241,245,249,.90);

  color:#475569;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  flex:0 0 auto;

  touch-action:manipulation;
}


.legend-toggle:hover {
  background:#e8edf2;
}


.legend-toggle svg {
  width:13px;
  height:13px;

  transition:transform .18s ease;
}


.legend-content {
  display:block;
}


.legend.collapsed {
  width:96px;
  min-width:96px;
  max-width:96px;

  padding:6px 7px;
}


.legend.collapsed .legend-content {
  display:none;
}


.legend.collapsed .legend-toggle svg {
  transform:rotate(180deg);
}


.legend-section {
  font-weight:800;
  color:#172b4d;

  margin-top:7px;
  margin-bottom:3px;
}


.legend-row {
  display:grid;

  grid-template-columns:
    24px 1fr;

  align-items:center;

  min-height:17px;
}


.legend-symbol {
  width:24px;

  display:flex;
  align-items:center;
  justify-content:center;
}


.legend-dot {
  width:9px;
  height:9px;
  border-radius:50%;
}


.legend-nb {
  width:14px;
  height:14px;

  box-sizing:border-box;

  background:white;

  border:1.5px solid #111827;

  border-radius:2px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:5.5px;
  font-weight:900;

  color:#111827;
}


.legend-diamond {
  width:10px;
  height:10px;

  background:#7b3fc6;

  transform:rotate(45deg);
}


.legend-triangle {
  width:0;
  height:0;

  border-left:6px solid transparent;
  border-right:6px solid transparent;
  border-bottom:10px solid #6b7280;
}


.legend-hexagon {
  width:13px;
  height:11px;

  background:#2b9fb3;

  clip-path:
    polygon(
      25% 0%,
      75% 0%,
      100% 50%,
      75% 100%,
      25% 100%,
      0% 50%
    );
}


.legend-ring {
  width:16px;
  height:8px;

  box-sizing:border-box;

  border:1.5px dashed #64748b;

  border-radius:50%;
}


.legend-line {
  width:17px;

  border-top:2.5px solid #2b9fb3;
}


/* =====================================================
   POPUPS
   ===================================================== */

.popup-title {
  font-weight:800;
  font-size:14px;
  margin-bottom:4px;
}


.popup-category {
  color:#64748b;

  font-size:10px;
  font-weight:700;

  text-transform:uppercase;

  letter-spacing:.04em;

  margin-bottom:5px;
}


.popup-score {
  margin:3px 0 6px;

  font-size:19px;
  font-weight:900;

  color:#172b4d;
}


.popup-role {
  margin-top:7px;

  font-size:12px;
  line-height:1.4;
}


.popup-note {
  margin-top:7px;

  font-size:11px;
  line-height:1.35;

  color:#64748b;
}


/* =====================================================
   MAPLIBRE / LEAFLET
   ===================================================== */

.maplibregl-map {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}


.maplibregl-ctrl-bottom-right {
  bottom:18px;
}


/* =====================================================
   MOBILE PORTRAIT / GENERAL MOBILE
   ===================================================== */

@media
(max-width:699px) {

  #title {
    top:10px;
    left:58px;

    width:calc(100vw - 128px);

    padding:8px 31px 8px 10px;

    border-radius:9px;
  }


  #title .eyebrow {
    font-size:7.5px;
    line-height:1.1;
    letter-spacing:.07em;
    margin-bottom:2px;
  }


  #title h1 {
    margin:0 0 3px;

    font-size:13px;
    line-height:1.12;
  }


  #title .subtitle {
    font-size:8.5px;
    line-height:1.22;
  }


  #titleToggle {
    top:5px;
    right:5px;

    width:23px;
    height:23px;

    border-radius:5px;
  }


  #titleToggle svg {
    width:13px;
    height:13px;
  }


  #title.collapsed {
    padding:8px 31px 8px 10px;
  }


  #rightControls {
    top:10px;
    right:10px;
    gap:7px;
  }


  .map-control-button {
    width:42px;
    height:42px;
  }


  #layerPanel {
    right:10px;

    width:min(
      275px,
      calc(100vw - 20px)
    );

    padding:8px 10px;

    border-radius:9px;

    font-size:10px;
  }


  .layer-option {
    min-height:25px;
  }


  .layer-panel-section {
    margin-top:6px;
    padding-top:6px;
  }


  .legend {
    padding:6px 8px;

    border-radius:8px;

    font-size:8.5px;
    line-height:1.25;

    max-width:190px;
  }


  .legend-title {
    font-size:8px;
  }


  .legend-toggle {
    width:20px;
    height:20px;

    border-radius:4px;
  }


  .legend-toggle svg {
    width:11px;
    height:11px;
  }


  .legend.collapsed {
    width:86px;
    min-width:86px;
    max-width:86px;

    padding:5px 6px;
  }


  .legend-section {
    margin-top:5px;
    margin-bottom:2px;
  }


  .legend-row {
    grid-template-columns:
      22px 1fr;

    min-height:15px;
  }


  .legend-symbol {
    width:22px;
  }


  .legend-dot {
    width:8px;
    height:8px;
  }


  .legend-nb {
    width:12px;
    height:12px;

    font-size:4.8px;
  }


  .legend-diamond {
    width:9px;
    height:9px;
  }


  .legend-triangle {
    border-left-width:5px;
    border-right-width:5px;
    border-bottom-width:9px;
  }


  .legend-hexagon {
    width:11px;
    height:9px;
  }


  .legend-ring {
    width:14px;
    height:7px;
  }


  .legend-line {
    width:15px;

    border-top-width:2px;
  }

}


/* =====================================================
   MOBILE LANDSCAPE
   ===================================================== */

@media
(max-width:899px)
and (orientation:landscape) {

  #title {
    top:10px;
    left:88px;

    width:min(
      410px,
      calc(100vw - 190px)
    );

    padding:8px 31px 8px 10px;

    border-radius:9px;
  }


  #title .eyebrow {
    font-size:7.5px;
    line-height:1.08;
    margin-bottom:3px;
  }


  #title h1 {
    font-size:13px;
    line-height:1.1;

    margin:0 0 4px;
  }


  #title .subtitle {
    font-size:8.5px;
    line-height:1.18;
  }


  #title.collapsed {
    padding:8px 31px 8px 10px;
  }


  #rightControls {
    top:10px;
    right:10px;
    gap:7px;
  }


  .legend {
    max-width:245px;

    padding:5px 7px;

    font-size:8px;
    line-height:1.14;

    margin-right:0;
    margin-bottom:3px;
  }


  .legend-header {
    min-height:18px;
  }


  .legend-title {
    font-size:8px;
  }


  .legend-toggle {
    width:19px;
    height:19px;
  }


  .legend-toggle svg {
    width:10px;
    height:10px;
  }


  .legend-section {
    margin-top:4px;
    margin-bottom:1px;
  }


  .legend-row {
    grid-template-columns:
      20px 1fr;

    min-height:12px;
  }


  .legend-symbol {
    width:20px;
  }


  .legend.collapsed {
    width:84px;
    min-width:84px;
    max-width:84px;

    padding:4px 6px;
  }


  .leaflet-bottom.leaflet-right {
    right:0;
  }


  #layerPanel {
    right:10px;

    width:270px;

    max-height:calc(100vh - 95px);

    overflow-y:auto;

    padding:7px 9px;

    font-size:9px;
  }


  .layer-option {
    min-height:22px;
  }

}


/* =====================================================
   PRINT
   ===================================================== */

@media print {

  .leaflet-control-zoom,
  #rightControls,
  #layerPanel,
  #titleToggle,
  .legend-toggle {
    display:none !important;
  }

}

</style>

</head>


<body>


<div id="map"></div>


<!-- =====================================================
     TITLE
     ===================================================== -->

<div id="title">

  <button
    id="titleToggle"
    type="button"
    aria-label="Collapse map title"
    title="Collapse map title"
  >

    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
    >

      <path
        d="M6 15L12 9L18 15"
        fill="none"
        stroke="currentColor"
        stroke-width="2.3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

    </svg>

  </button>


  <div class="eyebrow">
    Mapping Retail Opportunity Through GIS
  </div>


  <h1>
    New Balance Columbus | Brand-Market Fit
  </h1>


  <p class="subtitle">

    Three candidate strategies viewed alongside
    New Balance retail, specialty-running distribution,
    active-lifestyle geography, and the broader
    athletic-retail network.

  </p>

</div>


<!-- =====================================================
     RIGHT CONTROLS
     ===================================================== -->

<div id="rightControls">


  <button
    id="homeButton"
    class="map-control-button"
    type="button"
    aria-label="Return to default map extent"
    title="Return to default map extent"
  >

    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
    >

      <path
        d="
          M3 11.2
          L12 3.8
          L21 11.2
        "
        fill="none"
        stroke="#334155"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="
          M5.5 10.5
          V20
          H10
          V14
          H14
          V20
          H18.5
          V10.5
        "
        fill="none"
        stroke="#334155"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

    </svg>

  </button>


  <button
    id="layersButton"
    class="map-control-button"
    type="button"
    aria-label="Open map layers"
    title="Map layers"
    aria-expanded="false"
  >

    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
    >

      <path
        d="
          M12 3
          L21 8
          L12 13
          L3 8
          Z
        "
        fill="none"
        stroke="#334155"
        stroke-width="1.9"
        stroke-linejoin="round"
      />

      <path
        d="
          M4.5 12
          L12 16
          L19.5 12
        "
        fill="none"
        stroke="#334155"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="
          M4.5 16
          L12 20
          L19.5 16
        "
        fill="none"
        stroke="#334155"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

    </svg>

  </button>

</div>


<!-- =====================================================
     CUSTOM LAYERS PANEL
     ===================================================== -->

<div
  id="layerPanel"
  aria-hidden="true"
>


  <div class="layer-panel-section">

    <div class="layer-panel-title">
      Basemap
    </div>


    <label class="layer-option">

      <input
        type="radio"
        name="basemap"
        value="positron"
        checked
      >

      <span>
        OpenFreeMap Positron
      </span>

    </label>


    <label class="layer-option">

      <input
        type="radio"
        name="basemap"
        value="osm"
      >

      <span>
        OpenStreetMap
      </span>

    </label>

  </div>


  <div class="layer-panel-section">

    <div class="layer-panel-title">
      Map Layers
    </div>


    <label class="layer-option">

      <input
        type="checkbox"
        data-layer="candidates"
        checked
      >

      <span>
        Candidate Areas
      </span>

    </label>


    <label class="layer-option">

      <input
        type="checkbox"
        data-layer="candidateRings"
        checked
      >

      <span>
        3-Mile Evaluation Areas
      </span>

    </label>


    <label class="layer-option">

      <input
        type="checkbox"
        data-layer="nb"
        checked
      >

      <span>
        New Balance Owned Retail
      </span>

    </label>


    <label class="layer-option">

      <input
        type="checkbox"
        data-layer="majorRetail"
        checked
      >

      <span>
        Major Athletic Retail Nodes
      </span>

    </label>


    <label class="layer-option">

      <input
        type="checkbox"
        data-layer="crc"
        checked
      >

      <span>
        Specialty Running / NB Distribution
      </span>

    </label>


    <label class="layer-option">

      <input
        type="checkbox"
        data-layer="active"
        checked
      >

      <span>
        Running & Active-Lifestyle Geography
      </span>

    </label>

  </div>

</div>


<script>

function updateLayerPanelPosition() {

  const panel =

    "layerPanel"
  );


  const titleRect =
  title.getBoundingClientRect();


  const desiredTop =
  Math.ceil(
    titleRect.bottom + 10
  );


  panel.style.top =
    `${desiredTop}px`;

}


titleToggle.addEventListener(

  "click",

  function(event) {

    event.preventDefault();

    event.stopPropagation();


    const isCollapsed =
    title.classList.toggle(
      "collapsed"
    );


    titleToggle.setAttribute(

      "aria-label",

      isCollapsed
        ?
        "Expand map title"
        :
        "Collapse map title"

    );


    titleToggle.setAttribute(

      "title",

      isCollapsed
        ?
        "Expand map title"
        :
        "Collapse map title"

    );


    requestAnimationFrame(

      () => {

        updateLayerPanelPosition();

      }

    );

  }

);

   ===================================================== */

document.getElementById(

);


const layerPanel =
document.getElementById(
  "layerPanel"
);


function closeLayerPanel() {

  layerPanel
    .classList
    .remove(
      "open"
    );


  layerPanel.setAttribute(
    "aria-hidden",
    "true"
  );


  layersButton.setAttribute(
    "aria-expanded",
    "false"
  );

}


function openLayerPanel() {

  updateLayerPanelPosition();


  layerPanel
    .classList
    .add(
      "open"
    );


  layerPanel.setAttribute(
    "aria-hidden",
    "false"
  );


  layersButton.setAttribute(
    "aria-expanded",
    "true"
  );

}


layersButton.addEventListener(

  "click",

  function(event) {

    event.preventDefault();

    event.stopPropagation();


    if (
      layerPanel
      .classList
      .contains(
        "open"
      )
    ) {

      closeLayerPanel();

    }

    else {

      openLayerPanel();

    }

  }

);


layerPanel.addEventListener(

  "click",

  function(event) {

    event.stopPropagation();

  }

);


document.addEventListener(

  "click",

  function(event) {

    if (

      !layerPanel.contains(
        event.target
      )

      &&

      !layersButton.contains(
        event.target
      )

    ) {

      closeLayerPanel();

    }

  }

);


/* =====================================================
   BASEMAP SWITCHING
   ===================================================== */

document
.querySelectorAll(
  'input[name="basemap"]'
)
.forEach(

  input => {

    input.addEventListener(

      "change",

      function() {

        if (
          !this.checked
        ) {

          return;

        }


        if (
          this.value ===
          "positron"
        ) {

          if (
            map.hasLayer(
              osmLayer
            )
          ) {

            map.removeLayer(
              osmLayer
            );

          }


          if (
            !map.hasLayer(
              positronLayer
            )
          ) {

            positronLayer
              .addTo(map);

          }

        }


        if (
          this.value ===
          "osm"
        ) {

          if (
            map.hasLayer(
              positronLayer
            )
          ) {

            map.removeLayer(
              positronLayer
            );

          }


          if (
            !map.hasLayer(
              osmLayer
            )
          ) {

            osmLayer
              .addTo(map);

            osmLayer
              .bringToBack();

          }

        }

      }

    );

  }

);


/* =====================================================
   OVERLAY SWITCHING
   ===================================================== */

document
.querySelectorAll(
  'input[data-layer]'

.forEach(

  input => {

    input.addEventListener(

      "change",

      function() {

        const layerName =
        this.dataset.layer;


        const layer =
        layers[layerName];


        if (
          !layer
        ) {

          return;

        }


        if (
          this.checked
        ) {

          if (
            !map.hasLayer(
              layer
            )
          ) {

            layer.addTo(map);

          }

        }

        else {

          if (
            map.hasLayer(
              layer
            )
          ) {

            map.removeLayer(
              layer
            );

          }

        }

      }

    );

  }

);


/* =====================================================
   UI EVENT PROPAGATION
   ===================================================== */

[
  title,
  document.getElementById(
    "rightControls"
  ),
  layerPanel
]

.forEach(

  element => {

    L.DomEvent
      .disableClickPropagation(
        element
      );

    L.DomEvent
      .disableScrollPropagation(
        element
      );

  }

);


/* =====================================================
   RESIZE / ORIENTATION HANDLING
   ===================================================== */

function refreshLayout() {

  map.invalidateSize();

  updateLayerPanelPosition();

}


window.addEventListener(

  "resize",

  function() {

    refreshLayout();

  }

);


window.addEventListener(

  "orientationchange",

  function() {

    setTimeout(

      function() {

        refreshLayout();

      },

      250

    );

  }

);


updateLayerPanelPosition();


</script>

</body>
