<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<title>New Balance Columbus | Brand-Market Fit</title>


<!-- =====================================================
     LEAFLET
     ===================================================== -->

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- =====================================================
     MAPLIBRE
     ===================================================== -->

<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
/>

<script
  src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js">
</script>

<script
  src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js">
</script>


<style>

html,
body {
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:#f4f5f7;
}


#map {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}


/* =====================================================
   TITLE
   ===================================================== */

#title {
  position:absolute;

  top:max(
    14px,
    env(safe-area-inset-top)
  );

  left:70px;

  z-index:1100;

  width:min(
    390px,
    calc(100vw - 154px)
  );

  box-sizing:border-box;

  background:rgba(255,255,255,.97);

  border:1px solid rgba(15,23,42,.08);

  border-radius:12px;

  padding:12px 42px 12px 14px;

  box-shadow:
    0 4px 18px rgba(15,23,42,.16);
}


#title .eyebrow {
  font-size:10px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:.08em;
  color:#64748b;
  text-transform:uppercase;
  margin-bottom:4px;
}


#title h1 {
  margin:0 0 5px;
  font-size:18px;
  line-height:1.15;
  color:#172b4d;
}


#title .subtitle {
  margin:0;
  font-size:11.5px;
  line-height:1.35;
  color:#586474;
}


#titleToggle {
  position:absolute;
  top:8px;
  right:8px;

  width:28px;
  height:28px;

  padding:0;
  border:0;
  border-radius:6px;

  background:rgba(241,245,249,.90);

  color:#475569;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
  touch-action:manipulation;
}


#titleToggle:hover {
  background:#e8edf2;
}


#titleToggle svg {
  width:16px;
  height:16px;
  transition:transform .18s ease;
}


#title.collapsed {
  padding-top:10px;
  padding-bottom:10px;
}


#title.collapsed .eyebrow,
#title.collapsed .subtitle {
  display:none;
}


#title.collapsed h1 {
  margin:0;
}


#title.collapsed #titleToggle svg {
  transform:rotate(180deg);
}


/* =====================================================
   RIGHT CONTROLS
   ===================================================== */

#rightControls {
  position:absolute;

  top:max(
    14px,
    env(safe-area-inset-top)
  );

  right:14px;

  z-index:1200;

  display:flex;
  flex-direction:column;
  align-items:flex-end;

  gap:8px;
}


.map-control-button {
  width:42px;
  height:42px;

  padding:0;
  box-sizing:border-box;

  border:1px solid rgba(0,0,0,.18);
  border-radius:8px;

  background:#ffffff;

  box-shadow:0 1px 5px rgba(0,0,0,.22);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


.map-control-button:hover,
.map-control-button.active {
  background:#f1f5f9;
}


.map-control-button svg {
  width:22px;
  height:22px;
  display:block;
}


/* =====================================================
   LAYER PANEL
   ===================================================== */

#layerPanel {
  position:absolute;

  right:14px;

  z-index:1190;

  display:none;

  width:min(
    286px,
    calc(100vw - 28px)
  );

  box-sizing:border-box;

  background:rgba(255,255,255,.98);

  border:1px solid rgba(15,23,42,.10);

  border-radius:10px;

  box-shadow:
    0 4px 16px rgba(15,23,42,.20);

  padding:10px 12px;

  font-size:11px;
  line-height:1.3;
}


#layerPanel.open {
  display:block;
}


.layer-panel-title {
  font-size:9px;
  font-weight:900;
  letter-spacing:.07em;
  color:#475569;
  text-transform:uppercase;
  margin-bottom:5px;
}


.layer-panel-section {
  margin-top:8px;
  padding-top:7px;
  border-top:1px solid #e5e7eb;
}


.layer-panel-section:first-child {
  margin-top:0;
  padding-top:0;
  border-top:0;
}


.layer-option {
  display:grid;
  grid-template-columns:20px 1fr;
  align-items:center;

  min-height:27px;

  gap:3px;

  color:#334155;

  cursor:pointer;
  user-select:none;
}


.layer-option input {
  margin:0;
  width:14px;
  height:14px;
  accent-color:#475569;
}


.layer-option span {
  display:block;
}


/* =====================================================
   CANDIDATE MARKERS
   ===================================================== */

.candidate-marker {
  width:40px;
  height:40px;

  border-radius:50%;

  border:3px solid rgba(255,255,255,.98);

  box-sizing:border-box;

  box-shadow:
    0 2px 8px rgba(0,0,0,.34);

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:17px;
  font-weight:900;

  opacity:.90;
}


.a {
  background:#d73027;
}


.b {
  background:#245bbf;
}


.c {
  background:#18864b;
}


/* =====================================================
   NEW BALANCE
   ===================================================== */

.nb-marker {
  width:28px;
  height:28px;

  box-sizing:border-box;

  background:#ffffff;

  border:2px solid #111827;

  border-radius:3px;

  box-shadow:
    0 1px 5px rgba(0,0,0,.28);

  color:#111827;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:10px;
  font-weight:900;

  letter-spacing:-.3px;
}


/* =====================================================
   SPECIALTY RUNNING
   ===================================================== */

.crc-marker-wrap {
  position:relative;
  width:18px;
  height:16px;
}


.crc-triangle {
  position:absolute;

  left:1px;
  top:1px;

  width:0;
  height:0;

  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-bottom:14px solid #6b7280;

  filter:
    drop-shadow(
      0 1px 1px rgba(0,0,0,.28)
    );
}


/* =====================================================
   MAJOR ATHLETIC RETAIL
   ===================================================== */

.major-retail-marker {
  width:15px;
  height:15px;

  box-sizing:border-box;

  background:#7b3fc6;

  transform:rotate(45deg);

  border-radius:1px;

  box-shadow:
    0 1px 3px rgba(0,0,0,.30);
}


/* =====================================================
   ACTIVE NODE
   ===================================================== */

.active-hexagon {
  width:17px;
  height:15px;

  background:#2b9fb3;

  clip-path:
    polygon(
      25% 0%,
      75% 0%,
      100% 50%,
      75% 100%,
      25% 100%,
      0% 50%
    );

  filter:
    drop-shadow(
      0 1px 1px rgba(0,0,0,.28)
    );
}


/* =====================================================
   CUSTOM INTERSTATE SHIELDS
   40% OF ORIGINAL SIZE
   ===================================================== */

.interstate-shield-wrapper {
  width:13.6px;
  height:14.8px;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
}


.interstate-shield-wrapper.three-digit {
  width:15.6px;
  height:15.6px;
}


.interstate-shield-wrapper svg {
  display:block;

  width:100%;
  height:100%;

  overflow:visible;
}


/* =====================================================
   LEGEND
   ===================================================== */

.legend {
  position:relative;

  background:rgba(255,255,255,.97);

  padding:9px 11px;

  border-radius:10px;

  border:1px solid rgba(15,23,42,.08);

  box-shadow:
    0 2px 11px rgba(15,23,42,.15);

  font-size:10.5px;
  line-height:1.35;

  max-width:250px;

  box-sizing:border-box;
}


.legend-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}


.legend-title {
  font-size:10px;
  font-weight:900;
  letter-spacing:.06em;
  color:#334155;
  text-transform:uppercase;
  margin:0;
}


.legend-toggle {
  width:24px;
  height:24px;

  padding:0;
  border:0;

  border-radius:5px;

  background:rgba(241,245,249,.90);

  color:#475569;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  flex:0 0 auto;

  touch-action:manipulation;
}


.legend-toggle:hover {
  background:#e8edf2;
}


.legend-toggle svg {
  width:13px;
  height:13px;
  transition:transform .18s ease;
}


.legend-content {
  display:block;
}


.legend.collapsed {
  width:96px;
  min-width:96px;
  max-width:96px;
  padding:6px 7px;
}


.legend.collapsed .legend-content {
  display:none;
}


.legend.collapsed .legend-toggle svg {
  transform:rotate(180deg);
}


.legend-section {
  font-weight:800;
  color:#172b4d;
  margin-top:7px;
  margin-bottom:3px;
}


.legend-row {
  display:grid;
  grid-template-columns:24px 1fr;

  column-gap:5px;

  align-items:center;

  min-height:17px;
}


.legend-symbol {
  width:24px;

  display:flex;
  align-items:center;
  justify-content:center;
}


.legend-dot {
  width:9px;
  height:9px;
  border-radius:50%;
}


.legend-nb {
  width:14px;
  height:14px;

  box-sizing:border-box;

  background:white;

  border:1.5px solid #111827;

  border-radius:2px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:5.5px;
  font-weight:900;

  color:#111827;
}


.legend-diamond {
  width:10px;
  height:10px;

  background:#7b3fc6;

  transform:rotate(45deg);
}


.legend-triangle {
  width:0;
  height:0;

  border-left:6px solid transparent;
  border-right:6px solid transparent;
  border-bottom:10px solid #6b7280;
}


.legend-hexagon {
  width:13px;
  height:11px;

  background:#2b9fb3;

  clip-path:
    polygon(
      25% 0%,
      75% 0%,
      100% 50%,
      75% 100%,
      25% 100%,
      0% 50%
    );
}


.legend-ring {
  width:16px;
  height:8px;

  box-sizing:border-box;

  border:1.5px dashed #64748b;

  border-radius:50%;
}


.legend-line {
  width:17px;

  border-top:2.5px solid #2b9fb3;
}


/* =====================================================
   NORTH ARROW
   ===================================================== */

#northArrow {
  position:absolute;

  left:10px;
  bottom:72px;

  z-index:1005;

  width:27px;

  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;

  color:#334155;

  pointer-events:none;

  text-shadow:
    0 1px 2px rgba(255,255,255,.9);
}


#northArrow .north-letter {
  font-size:9px;
  font-weight:900;
  line-height:1;

  margin-bottom:1px;

  width:20px;

  text-align:center;
}


#northArrow svg {
  width:20px;
  height:24px;
}


/* =====================================================
   SCALE
   ===================================================== */

.leaflet-bottom.leaflet-left {
  bottom:30px;
}


/* =====================================================
   POPUPS
   ===================================================== */

.popup-title {
  font-weight:800;
  font-size:14px;
  margin-bottom:4px;
  color:#172b4d;
}


.popup-category {
  color:#64748b;

  font-size:10px;
  font-weight:700;

  text-transform:uppercase;
  letter-spacing:.04em;

  margin-bottom:5px;
}


.popup-score {
  font-weight:800;
  margin-bottom:5px;
}


.popup-text {
  font-size:12px;
  line-height:1.4;
  color:#334155;
}


.popup-role {
  margin-top:6px;
  font-size:11px;
  line-height:1.4;
  color:#475569;
}


/* =====================================================
   LEAFLET
   ===================================================== */

.leaflet-control-zoom {
  margin-top:14px !important;
  margin-left:14px !important;
}


.leaflet-control-scale {
  margin-left:10px !important;
}


.leaflet-control-attribution {
  font-size:9px;
}


/* =====================================================
   MOBILE PORTRAIT
   ===================================================== */

@media
(max-width:699px)
and
(orientation:portrait) {

  #title {
    top:max(
      10px,
      env(safe-area-inset-top)
    );

    left:58px;

    width:
      calc(100vw - 116px);

    max-width:none;

    padding:
      10px 35px 10px 11px;
  }


  #title .eyebrow {
    font-size:8px;
  }


  #title h1 {
    font-size:14px;
  }


  #title .subtitle {
    font-size:9.5px;
  }


  #titleToggle {
    top:6px;
    right:5px;

    width:25px;
    height:25px;
  }


  #rightControls {
    top:max(
      10px,
      env(safe-area-inset-top)
    );

    right:8px;

    gap:6px;
  }


  .map-control-button {
    width:38px;
    height:38px;
  }


  .map-control-button svg {
    width:20px;
    height:20px;
  }


  #layerPanel {
    right:8px;

    width:min(
      276px,
      calc(100vw - 16px)
    );

    max-height:
      calc(100dvh - 100px);

    overflow-y:auto;
  }


  .legend {
    font-size:9px;
    max-width:218px;
    padding:7px 8px;
  }


  .legend-title {
    font-size:9px;
  }


  .legend-section {
    margin-top:5px;
  }


  .legend-row {
    min-height:15px;
    grid-template-columns:22px 1fr;
  }


  .legend-symbol {
    width:22px;
  }


  #northArrow {
    bottom:68px;
  }


  .leaflet-bottom.leaflet-left {
    bottom:28px;
  }

}


/* =====================================================
   MOBILE LANDSCAPE
   ===================================================== */

@media
(max-width:899px)
and
(orientation:landscape) {

  #title {
    top:8px;

    left:58px;

    width:min(
      360px,
      calc(100vw - 126px)
    );

    padding:
      8px 34px 8px 11px;
  }


  #title .eyebrow {
    font-size:7.5px;
    margin-bottom:2px;
  }


  #title h1 {
    font-size:13px;
    margin-bottom:3px;
  }


  #title .subtitle {
    font-size:8.5px;
    line-height:1.25;
  }


  #titleToggle {
    width:24px;
    height:24px;

    top:5px;
    right:5px;
  }


  #rightControls {
    top:8px;
    right:8px;
    gap:5px;
  }


  .map-control-button {
    width:36px;
    height:36px;
  }


  .map-control-button svg {
    width:18px;
    height:18px;
  }


  #layerPanel {
    top:10px !important;

    right:52px;

    width:270px;

    max-height:
      calc(100dvh - 20px);

    overflow-y:auto;
  }


  .layer-option {
    min-height:23px;
  }


  .legend {
    max-width:205px;

    padding:5px 7px;

    font-size:8.5px;
    line-height:1.2;
  }


  .legend-header {
    min-height:18px;
  }


  .legend-toggle {
    width:20px;
    height:20px;
  }


  .legend-section {
    margin-top:3px;
    margin-bottom:2px;
  }


  .legend-row {
    min-height:13px;
    grid-template-columns:20px 1fr;
  }


  .legend-symbol {
    width:20px;
  }


  #northArrow {
    bottom:57px;
  }


  .leaflet-bottom.leaflet-left {
    bottom:22px;
  }

}


/* =====================================================
   SMALL DESKTOP / TABLET
   ===================================================== */

@media
(min-width:700px)
and
(max-width:1050px) {

  #title {
    max-width:
      calc(100vw - 150px);
  }

}

</style>

</head>


<body>


<div id="map"></div>


<div id="title">

  <div class="eyebrow">
    Mapping Retail Opportunity Through GIS
  </div>

  <h1>
    New Balance Columbus | Brand-Market Fit
  </h1>

  <p class="subtitle">
    Three candidate strategies viewed alongside New Balance retail,
    specialty-running distribution, active-lifestyle geography,
    and the broader athletic-retail network.
  </p>

  <button
    id="titleToggle"
    type="button"
    aria-label="Collapse map title"
    aria-expanded="true"
  >

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M6 9l6 6 6-6"/>
    </svg>

  </button>

</div>


<div id="rightControls">

  <button
    id="homeButton"
    class="map-control-button"
    type="button"
    title="Return to home extent"
    aria-label="Return to home extent"
  >

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="#334155"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 11.5L12 4l9 7.5"/>
      <path d="M5.5 10v9h13v-9"/>
      <path d="M9.5 19v-5h5v5"/>
    </svg>

  </button>


  <button
    id="layersButton"
    class="map-control-button"
    type="button"
    title="Map layers"
    aria-label="Map layers"
    aria-expanded="false"
  >

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="#334155"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M12 3L3 8l9 5 9-5-9-5z"/>
      <path d="M3 12l9 5 9-5"/>
      <path d="M3 16l9 5 9-5"/>
    </svg>

  </button>

</div>


<div id="layerPanel">

  <div class="layer-panel-section">

    <div class="layer-panel-title">
      Basemap
    </div>


    <label class="layer-option">

      <input
        type="radio"
        name="basemap"
        value="positron"
        checked
      >

      <span>
        OpenFreeMap Positron
      </span>

    </label>


    <label class="layer-option">

      <input
        type="radio"
        name="basemap"
        value="osm"
      >

      <span>
        OpenStreetMap
      </span>

    </label>

  </div>


  <div class="layer-panel-section">

    <div class="layer-panel-title">
      Analysis Layers
    </div>


    <label class="layer-option">
      <input id="toggleCandidates" type="checkbox" checked>
      <span>Candidate Areas</span>
    </label>


    <label class="layer-option">
      <input id="toggleRings" type="checkbox" checked>
      <span>3-Mile Evaluation Areas</span>
    </label>


    <label class="layer-option">
      <input id="toggleNB" type="checkbox" checked>
      <span>New Balance Owned Retail</span>
    </label>


    <label class="layer-option">
      <input id="toggleMajorRetail" type="checkbox" checked>
      <span>Major Athletic Retail Nodes</span>
    </label>


    <label class="layer-option">
      <input id="toggleCRC" type="checkbox" checked>
      <span>Specialty Running / NB Distribution</span>
    </label>


    <label class="layer-option">
      <input id="toggleActive" type="checkbox" checked>
      <span>Running &amp; Active-Lifestyle Geography</span>
    </label>

  </div>

</div>


<div
  id="northArrow"
  aria-hidden="true"
>

  <div class="north-letter">
    N
  </div>

  <svg
    viewBox="0 0 24 30"
    xmlns="http://www.w3.org/2000/svg"
  >

    <path
      d="M12 1 L20 25 L12 20 L4 25 Z"
      fill="#334155"
    />

    <path
      d="M12 4 L12 20"
      stroke="#ffffff"
      stroke-width="1.3"
      opacity=".85"
    />

  </svg>

</div>


<script>

/* =====================================================
   MAP
   ===================================================== */

const map =
  L.map(
    "map",
    {
      zoomControl:true,
      preferCanvas:false,
      minZoom:5
    }
  );


/* =====================================================
   HOME EXTENT
   ===================================================== */

const finalBounds =
  L.latLngBounds(
    [
      [39.865,-83.185],
      [40.315,-82.735]
    ]
  );


let homeReferenceZoom =
  null;


/* =====================================================
   BASEMAPS
   ===================================================== */

const openFreeMapAttribution =
  '&copy; <a href="https://openfreemap.org/" target="_blank">OpenFreeMap</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>';


const osmAttribution =
  '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>';


const positron =
  L.maplibreGL(
    {
      style:
        "https://tiles.openfreemap.org/styles/positron",

      attribution:
        openFreeMapAttribution
    }
  );


const osm =
  L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,

      attribution:

/* =====================================================
   POSITRON NATIVE ROAD LABEL DENSITY
   ===================================================== */

function tunePositronNativeRoadLabels() {

  let glMap;


  try {

    glMap =
      positron.getMaplibreMap();

  } catch (error) {

    return;

  }


  if (!glMap) {
    return;
  }


  const apply =
    function () {

      const style =
        glMap.getStyle();


      if (
        !style ||
        !style.layers
      ) {
        return;
      }


      style.layers.forEach(
        layer => {

          if (
            layer.id ===
            "highway_name_motorway"
          ) {

            try {

              glMap.setLayoutProperty(
                layer.id,
                "symbol-spacing",
                360
              );

            } catch (error) {}

          }


          if (
            layer.id &&
            (
              layer.id.includes("shield") ||
              layer.id.includes("interstate")
            )
          ) {

            try {

              if (
                layer.layout &&
                layer.layout["symbol-placement"] === "line"
              ) {

                glMap.setLayoutProperty(
                  layer.id,
                  "symbol-spacing",
                  360
                );

              }

            } catch (error) {}

          }

        }
      );

    };


  if (glMap.loaded()) {

    apply();

  } else {

    glMap.once(
      "load",
      apply
    );

  }

}


tunePositronNativeRoadLabels();

function interstateShieldSVG(

  const center =
    viewWidth / 2;


  const right =

  const rightShoulder =
    viewWidth - 9;


  const textSize =
    isThreeDigit

      : 15;


  return `

    <div
      class="
        interstate-shield-wrapper
        ${isThreeDigit ? "three-digit" : ""}
      "
    >

      <svg
        viewBox="0 0 ${viewWidth} 44"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >


        <path

          d="
            M 4 14

            C 4 10,
              6 6,
              9 5

            C 12 7.5,
              16 8.5,
              ${center} 5

            C ${center + 5} 8.5,
              ${rightShoulder - 3} 7.5,
              ${rightShoulder} 5

            C ${right - 2} 6,
              ${right} 10,
              ${right} 14

            L ${right} 22

            C ${right} 30,
              ${viewWidth - 11} 37,
              ${center} 41

            C 11 37,
              4 30,
              4 22

            Z
          "

          fill="#FFFFFF"

          stroke="#4B5563"

          stroke-width="1.65"

          stroke-linejoin="round"

        />


        <path

          d="
            M 4.8 14

            C 4.8 10.5,
              6.4 7,
              9 5.8

            C 12 8,
              16 9,
              ${center} 5.8

            C ${center + 5} 9,
              ${rightShoulder - 3} 8,
              ${rightShoulder} 5.8

            C ${right - 2.5} 7,
              ${right - .8} 10.5,
              ${right - .8} 14

            L ${right - .8} 15.5

            L 4.8 15.5

            Z
          "

          fill="#4B5563"

        />


        <text

          x="${center}"

          y="26.2"

          text-anchor="middle"

          dominant-baseline="middle"

          fill="#4B5563"

          font-family="
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            Arial,
            sans-serif
          "

          font-size="${textSize}"

          font-weight="700"

          letter-spacing="-0.35"

        >
          ${route}
        </text>


      </svg>

    </div>

  `;

}

  );

/* =====================================================
   INTERSTATE VISIBILITY
   ===================================================== */

function updateInterstateReferenceVisibility() {

  if (
    homeReferenceZoom === null
  ) {
    return;
  }


  const currentZoom =
    map.getZoom();


  const shouldShow =
    positronIsSelected() &&
    currentZoom <=
      (
        homeReferenceZoom + 1
      );


  if (shouldShow) {

    if (
      !map.hasLayer(
        interstateReferenceLayer
      )
    ) {

      interstateReferenceLayer
        .addTo(map);

    }

  } else {

    if (
      map.hasLayer(
        interstateReferenceLayer
      )
    ) {

      map.removeLayer(
        interstateReferenceLayer
      );

    }

  }

}


map.on(
  "zoomend",
  updateInterstateReferenceVisibility
);

}

    );


    L.DomEvent.disableScrollPropagation(
      div
    );


    legendElement =
      div;


    const toggle =
      div.querySelector(
        ".legend-toggle"
      );


    toggle.addEventListener(
      "click",
      function () {

        const collapsed =
          div.classList.toggle(
            "collapsed"
          );


        toggle.setAttribute(
          "aria-expanded",
          String(!collapsed)
        );


        toggle.setAttribute(
          "aria-label",
          collapsed
            ? "Expand map key"
            : "Collapse map key"
        );

      }
    );


    return div;

  };


legend.addTo(map);


/* =====================================================
   LEGEND HELPERS
   ===================================================== */

function setLegendCollapsed(
  collapsed
) {

  if (!legendElement) {
    return;
  }


  legendElement.classList.toggle(
    "collapsed",
    collapsed
  );


  const button =
    legendElement.querySelector(
      ".legend-toggle"
    );


  if (button) {

    button.setAttribute(
      "aria-expanded",
      String(!collapsed)
    );


    button.setAttribute(
      "aria-label",
      collapsed
        ? "Expand map key"
        : "Collapse map key"
    );

  }

}


/* =====================================================
   TITLE TOGGLE
   ===================================================== */

const title =
  document.getElementById(
    "title"
  );


const titleToggle =
  document.getElementById(
    "titleToggle"
  );


titleToggle.addEventListener(
  "click",
  function () {

    const collapsed =
      title.classList.toggle(
        "collapsed"
      );


    titleToggle.setAttribute(
      "aria-expanded",
      String(!collapsed)
    );


    titleToggle.setAttribute(
      "aria-label",
      collapsed
        ? "Expand map title"
        : "Collapse map title"
    );


    if (
      document
        .getElementById("layerPanel")
        .classList
        .contains("open")
    ) {

      updateLayerPanelPosition();

    }

  }
);


/* =====================================================
   RIGHT CONTROLS
   ===================================================== */

const homeButton =
  document.getElementById(
    "homeButton"
  );


const layersButton =
  document.getElementById(
    "layersButton"
  );


const layerPanel =
  document.getElementById(
    "layerPanel"
  );


homeButton.addEventListener(
  "click",
  goHome
);


/* =====================================================
   MOBILE UI
   ===================================================== */

function isMobileUI() {

  return window
    .matchMedia(
      "(max-width:899px)"
    )
    .matches;

}


let layersOpenedOnMobile =
  false;


/* =====================================================
   LAYER PANEL POSITION
   ===================================================== */

function updateLayerPanelPosition() {

  if (
    window.matchMedia(
      "(max-width:899px) and (orientation:landscape)"
    ).matches
  ) {

    layerPanel.style.top =
      "10px";

    return;

  }


  const titleRect =
    title.getBoundingClientRect();


  const minimumTop =
    70;


  let desiredTop =
    Math.max(
      titleRect.bottom + 10,
      minimumTop
    );


  const panelHeight =
    layerPanel.offsetHeight || 330;


  const maximumTop =
    window.innerHeight -
    panelHeight -
    12;


  if (
    maximumTop >
    minimumTop
  ) {

    desiredTop =
      Math.min(
        desiredTop,
        maximumTop
      );

  }


  layerPanel.style.top =
    `${desiredTop}px`;

}


/* =====================================================
   LAYER PANEL OPEN / CLOSE
   ===================================================== */

function openLayerPanel() {

  layerPanel.classList.add(
    "open"
  );


  layersButton.classList.add(
    "active"
  );


  layersButton.setAttribute(
    "aria-expanded",
    "true"
  );


  updateLayerPanelPosition();


  if (isMobileUI()) {

    layersOpenedOnMobile =
      true;


    setLegendCollapsed(
      true
    );

  }

}


function closeLayerPanel() {

  layerPanel.classList.remove(
    "open"
  );


  layersButton.classList.remove(
    "active"
  );


  layersButton.setAttribute(
    "aria-expanded",
    "false"
  );


  if (
    isMobileUI() &&
    layersOpenedOnMobile
  ) {

    setLegendCollapsed(
      false
    );


    layersOpenedOnMobile =
      false;

  }

}


layersButton.addEventListener(
  "click",
  function (event) {

    event.stopPropagation();


    if (
      layerPanel.classList
        .contains("open")
    ) {

      closeLayerPanel();

    } else {

      openLayerPanel();

    }

  }
);


layerPanel.addEventListener(
  "click",
  function (event) {

    event.stopPropagation();

  }
);


document.addEventListener(
  "click",
  function () {

    if (
      layerPanel.classList
        .contains("open")
    ) {

      closeLayerPanel();

    }

  }
);


/* =====================================================
   BASEMAP SWITCHING
   ===================================================== */

document
  .querySelectorAll(
    'input[name="basemap"]'
  )
  .forEach(
    input => {

      input.addEventListener(
        "change",
        function () {

          if (
            this.value === "positron"
          ) {

            if (
              map.hasLayer(osm)
            ) {

              map.removeLayer(osm);

            }


            if (
              !map.hasLayer(positron)
            ) {

              positron.addTo(map);

            }


            setTimeout(
              function () {

                tunePositronNativeRoadLabels();

                updateInterstateReferenceVisibility();

              },
              150
            );

          }


          if (
            this.value === "osm"
          ) {

            if (
              map.hasLayer(positron)
            ) {

              map.removeLayer(positron);

            }


            if (
              !map.hasLayer(osm)
            ) {

              osm.addTo(map);

            }


            updateInterstateReferenceVisibility();

          }

        }
      );

    }
  );


/* =====================================================
   ANALYSIS TOGGLES
   ===================================================== */

function connectToggle(
  checkboxId,
  layer
) {

  document
    .getElementById(
      checkboxId
    )
    .addEventListener(
      "change",
      function () {

        if (this.checked) {

          if (
            !map.hasLayer(layer)
          ) {

            layer.addTo(map);

          }

        } else {

          if (
            map.hasLayer(layer)
          ) {

            map.removeLayer(layer);

          }

        }

      }
    );

}


connectToggle(
  "toggleCandidates",
  candidateLayer
);


connectToggle(
  "toggleRings",
  ringLayer
);


connectToggle(
  "toggleNB",
  nbLayer
);


connectToggle(
  "toggleMajorRetail",
  majorRetailLayer
);


connectToggle(
  "toggleCRC",
  crcLayer
);


connectToggle(
  "toggleActive",
  activeLayer
);


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
  "resize",
  function () {

    map.invalidateSize(
      {
        animate:false
      }
    );


    if (
      layerPanel.classList
        .contains("open")
    ) {

      updateLayerPanelPosition();

    }

  }
);


/* =====================================================
   INITIAL POSITRON
   ===================================================== */

function initializePositronEnhancements() {

  let glMap;


  try {

    glMap =
      positron.getMaplibreMap();

  } catch (error) {

    return;

  }


  if (!glMap) {
    return;
  }


  if (glMap.loaded()) {

    tunePositronNativeRoadLabels();

  } else {

    glMap.once(
      "load",
      function () {

        tunePositronNativeRoadLabels();

      }
    );

  }

}


initializePositronEnhancements();


/* =====================================================
   INITIAL VIEW
   ===================================================== */

goHome();

</script>
